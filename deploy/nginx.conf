# Página do Timbrador: arquivo estático. O documento é montado no navegador de quem usa;
# a CSP impede a página de mandar qualquer coisa para fora: ela só lê arquivos do próprio site
# (o marca.json padrão, ao lado dela) e não fala com nenhum outro endereço.
server {
    listen 80;
    root /usr/share/nginx/html;
    index timbrador.html;
    charset utf-8;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; form-action 'none'; frame-src blob:; object-src blob:; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
